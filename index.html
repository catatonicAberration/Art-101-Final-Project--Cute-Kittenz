<!DOCTYPE html>
<html lang="en">

<head>
  <!-- All techy stuff goes here, inside HEAD -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Overall title of your page -->
  <title>FP Prototype</title>

  <link rel="preload" href="prototype.css" as="style">
  <link rel="preload" href="prototype.js" as="script">
  <link rel="preload" href="Painting.png" as="image">
  <link rel="stylesheet" href="prototype.css">
  <link rel="preload" href="images/tile_0168.png" as="image">

  <!-- Load the prototype script after the page markup is parsed -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="prototype.js" defer></script>
  

  <!--Font for the flip phone screen-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">


  <!--Flavor text-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
  <main class="middle-box" aria-label="Artwork area">
    <div class="door" aria-label="Locked door">
      <div class="door-frame">
        <div class="door-panel"><span class="door-knob"></span></div>
      </div>
    </div>
    <div class="key" role="img" aria-label="Key" tabindex="0">
      <span class="key-ring"></span><span class="key-shaft"></span><span class="key-tooth"></span>
    </div>
    <div class="padlock">
      <!--padlock asset here-->
    </div>
    <div class="couch" aria-label="Couch">
      <div class="cat-arm" aria-hidden="true"></div>
      <div class="couch-back"></div>
      <div class="couch-seat"></div>
      <div class="couch-base"></div>
    </div>
    <div class="painting">
      <img src="images/Painting.png" width="50" height="100" alt="Kitten artwork">
    </div>
  </main>

  <!--these divs are all organized by what assets they will have within them-->
  <div class="second-box" aria-label="Window Area">\
    <div id="exit-sign"></div>
    <div class="exit-door">
      <!--exit door-->
    </div>
    <div id="closet-door">
      <!--open and closed variations will be here, as well as the phone you can pick up as an item-->
    </div>
    <div class="window">
      <!--the door knob can live here initially along with the image of the window-->
    </div>
  </div>

  <!--when we are ready to drop the working phone into the game, we can put its HTML code in this space-->
  <div class="useable-phone">
    <div class="screen">
      <p>_-_-_-_-</p>
    </div>
    <div class="keypad">
      <div class="navpad">
        <button class="phone-icon"><i class="fa-solid fa-phone"></i></button>
        <div class="nav-buttons">
          <button class="nav-left"><</button>
          <button class="nav-right">></button>
        </div>
        <button class="phone-icon"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    <div class = "keys1">
      <button class="btn" id="key2"><span>ABC</span></button>
      <button class="btn" id="key3"><span>DEF</span></button>
      <button class="btn" id="key4"><span>GHI</span></button>
      <button class="btn" id="key5"><span>JKL</span></button>
    </div>
    <div class="keys2">
      <button class="btn" id="key6"><span>MNO</span></button>
      <button class="btn" id="key7"><span>PQRS</span></button>
      <button class="btn" id="key8"><span>TUV</span></button>
      <button class="btn" id="key9"><span>WXYZ</span></button>
    </div>
  </div>

</body>

</html>
