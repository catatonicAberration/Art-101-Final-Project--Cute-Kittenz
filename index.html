<!DOCTYPE html>
<html lang="en">

<head>
  <!-- All techy stuff goes here, inside HEAD -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Overall title of your page -->
  <title>FP Prototype</title>

  <link rel="preload" href="prototype.css" as="style">
  <link rel="preload" href="prototype.js" as="script">
  <link rel="preload" href="Painting.png" as="image">
  <link rel="stylesheet" href="prototype.css">
  <link rel="preload" href="images/tile_0168.png" as="image">

  <!-- Load the prototype script after the page markup is parsed -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="prototype.js" defer></script>
  

  <!--Font for the flip phone screen-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

  <!--Flavor text-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
  <main class="middle-box" aria-label="Artwork area">
    <div class="painting">
      <img src="images/Painting.png" width="50" height="100" alt="Kitten artwork">
    </div>
  </main>
<!--these divs are all place holders until we get the images done-->
  <div class="second-box" aria-label="Window Area">

    <div id="exit-sign"></div>
    <div id="exit-door-open"></div>
    <div id="phone"></div>
    <div id="exit-door-closed"></div>
    <div id="closet-door"></div>

    <div id="window"></div>
    <div id="door-knob"></div>

  </div>
</body>

</html>
